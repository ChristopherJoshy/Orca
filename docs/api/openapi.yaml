openapi: 3.1.0
info:
  title: ORCA API
  version: 1.0.0
  description: Versioned subscription, billing, reporting, agent, export, and MCP management API. Tenant scope derives from the authenticated session.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /health:
    get:
      security: []
      summary: Liveness and readiness without secret values
      responses:
        '200': { description: Service status }
  /auth/signup:
    post:
      security: []
      summary: Create a business admin account or a customer portal account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [email, password, businessName]
                - required: [email, password, businessId]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 9, writeOnly: true }
                businessName: { type: string, minLength: 1 }
                businessId: { type: string, format: uuid, description: Selects an existing business customer record matching this email. }
      responses:
        '201': { description: Business or local-development account created }
        '202': { description: Customer access request accepted; verification may be required }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      security: []
      summary: Start a server-side session
      responses:
        '200': { description: Session established with secure cookie }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: Revoke current session
      responses:
        '204': { description: Session revoked }
  /auth/verify-email:
    post:
      security: []
      summary: Verify an email with a one-time token and establish a session
      responses:
        '200': { description: Email verified; session cookie and CSRF token returned }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password-reset:
    post:
      security: []
      summary: Request a password-reset email without revealing account existence
      responses:
        '202': { description: Request accepted }
  /auth/password-reset/complete:
    post:
      security: []
      summary: Set a new password with a one-time reset token
      responses:
        '204': { description: Password changed and prior sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      summary: Get the current actor, user, and business
      responses:
        '200': { description: Current session context }
  /portal/me:
    get:
      summary: Get the signed-in customer's linked customer record
      responses:
        '200': { description: Customer self-service context }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products:
    get:
      summary: List business products
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
    post:
      summary: Create a product
      description: Admin-only. The server stores the product and its additive variants under the current business.
      responses:
        '201': { description: Product created }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/{id}:
    put:
      summary: Update a product catalog entry
      description: Admin-only. Replaces mutable catalog terms and increments the optimistic version. Existing subscription and invoice line snapshots are not rewritten.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, name, type, salesPrice, costPrice, taxRate]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1 }
                type: { type: string, minLength: 1 }
                salesPrice: { $ref: '#/components/schemas/Money' }
                costPrice: { $ref: '#/components/schemas/Money' }
                notes: { type: string }
                taxRate: { type: string }
                variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } }
      responses:
        '200': { description: Updated product with incremented version }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/{id}/archive:
    post:
      summary: Archive a product without deleting its history
      description: Admin-only. Archived products disappear from new catalog selection; existing subscriptions, invoices, and exports retain their references.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [expectedVersion], properties: { expectedVersion: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: Archived product; repeated requests are idempotent }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plans:
    get:
      summary: List billing plans
      responses:
        '200':
          description: Active plan page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanPage' }
    post:
      summary: Create a plan
      description: Admin-only. Defines the current business's recurring interval, quantity, availability, and lifecycle policy.
      responses:
        '201': { description: Plan created }
        '403': { $ref: '#/components/responses/Forbidden' }
  /plans/{id}:
    put:
      summary: Update a billing plan
      description: Admin-only. Mutable terms affect future operations; stored subscription and invoice line terms remain unchanged.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, name, interval, salesPrice, minimumQuantity, taxRate]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                name: { type: string, minLength: 1 }
                interval: { type: string, enum: [daily, weekly, monthly, yearly] }
                salesPrice: { $ref: '#/components/schemas/Money' }
                minimumQuantity: { type: integer, minimum: 1 }
                availableFrom: { type: string, format: date }
                availableUntil: { type: string, format: date }
                taxRate: { type: string }
                autoClose: { type: boolean }
                allowEarlyClose: { type: boolean }
                allowPause: { type: boolean }
                allowRenew: { type: boolean }
      responses:
        '200': { description: Updated plan with incremented version }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /plans/{id}/archive:
    post:
      summary: Archive a plan without deleting subscriptions or invoices
      description: Admin-only. Archived plans disappear from new subscription selection; existing subscriptions continue to reference their stored plan terms.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [expectedVersion], properties: { expectedVersion: { type: integer, minimum: 1 } } }
      responses:
        '200': { description: Archived plan; repeated requests are idempotent }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /customers:
    get:
      summary: List authorized business customers
      responses:
        '200': { description: Customer page }
    post:
      summary: Create customer record
      responses:
        '201': { description: Customer created }
  /quotations:
    get:
      summary: List quotations in the current business or customer scope
      responses:
        '200': { description: Quotation collection; empty results use an empty items array }
    post:
      summary: Prepare quotation from a customer and immutable line inputs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: string, format: uuid }
                planId: { type: string, format: uuid }
                templateId: { type: string, format: uuid, description: Uses the current business's template lines, plan, title, and default validity. }
                title: { type: string }
                validDays: { type: integer, minimum: 1, maximum: 3650 }
                quantity: { type: integer, minimum: 1 }
                lines: { type: array, items: { $ref: '#/components/schemas/CommercialLine' }, description: Plan and optional product lines; server resolves names, prices, taxes, and variant adjustments from the current business catalog. }
      responses:
        '201': { description: Quotation prepared }
  /quotation-templates:
    get:
      summary: List reusable quotation templates in the current business
      responses:
        '200':
          description: Tenant-scoped quotation template collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteTemplatePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a reusable plan offer with an optional product line
      description: The server copies current plan and product prices, taxes, and identifiers into template lines. Money stays a decimal string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, planId, validDays]
              properties:
                name: { type: string, minLength: 1 }
                planId: { type: string, format: uuid }
                productId: { type: string, format: uuid }
                productVariant: { type: string, description: Catalog variant name or value; its adjustment is snapshotted in the template line. }
                quantity: { type: integer, minimum: 1, default: 1 }
                productQuantity: { type: integer, minimum: 1, default: 1 }
                validDays: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        '201':
          description: Reusable quotation template created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /quotations/{id}/send:
    post:
      summary: Queue a quotation email request
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: Email request queued to the outbox }
  /quotations/{id}/accept:
    post:
      summary: Accept a sent quotation as its linked customer
      description: Accepts only a sent, unexpired quotation belonging to the authenticated customer. The validity date is evaluated in the business timezone.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Quotation accepted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /subscriptions:
    get:
      summary: List subscriptions visible to actor
      responses:
        '200': { description: Subscription page }
    post:
      summary: Prepare subscription draft or convert an accepted quotation
      description: Direct drafts resolve plan and product names, prices, taxes, and variant adjustments from the current business catalog. When quotationId is supplied, the accepted quotation's customer, plan and immutable lines are copied into the draft; successful conversion marks the quotation Converted in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, planId, startDate]
              properties:
                customerId: { type: string, format: uuid }
                planId: { type: string, format: uuid }
                quotationId: { type: string, format: uuid }
                discountId: { type: string, format: uuid }
                startDate: { type: string, format: date }
                expiryDate: { type: string, format: date }
                paymentTermsDays: { type: integer, minimum: 0, maximum: 365 }
                lines: { type: array, items: { $ref: '#/components/schemas/CommercialLine' } }
      responses:
        '201': { description: Draft subscription created }
        '409': { $ref: '#/components/responses/Conflict' }
  /subscriptions/{id}/transition:
    post:
      summary: Request an allowed lifecycle transition
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Updated subscription }
        '409': { $ref: '#/components/responses/Conflict' }
  /invoices:
    get:
      summary: List authorized invoices with balance/status filters
      responses:
        '200': { description: Invoice page }
  /invoices/{id}:
    get:
      summary: Retrieve invoice, stored calculation snapshot, and balance
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Invoice evidence }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{id}/confirm:
    post:
      summary: Confirm and post a draft invoice
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Confirmed invoice and posting reference }
        '409': { $ref: '#/components/responses/Conflict' }
  /invoices/{id}/cancel:
    post:
      summary: Cancel a draft or reverse an unpaid confirmed invoice
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Invoice cancelled; finalized evidence is preserved }
        '409': { $ref: '#/components/responses/Conflict' }
  /invoices/{id}/send:
    post:
      summary: Queue an invoice email request
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: Email request queued to the outbox }
  /invoices/{id}/payments:
    post:
      summary: Record and allocate a manual payment (approval policy applies)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: Payment allocation recorded }
  /portal/invoices/{id}/checkout:
    post:
      summary: Create or reuse a hosted Stripe Checkout session for the customer's own confirmed invoice
      description: The amount is derived server-side from the current outstanding balance. The payment is posted only from a verified Stripe webhook, never from the redirect.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Existing or newly created Checkout session
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, url, amount, currency]
                properties:
                  sessionId: { type: string }
                  url: { type: string, format: uri }
                  amount: { $ref: '#/components/schemas/Money' }
                  currency: { type: string, const: INR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { description: Stripe Checkout session could not be created or safely validated }
        '503': { description: Stripe Checkout is not configured }
  /billing/run:
    post:
      summary: Generate due draft invoices and advance billing cursors
      responses:
        '200': { description: Number of invoices generated in this run }
  /payments:
    get:
      summary: List authorized payment records
      responses:
        '200': { description: Payment collection }
  /discounts:
    get:
      summary: List business discounts
      responses:
        '200': { description: Discount collection }
    post:
      summary: Create a fixed or percentage discount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountCreate' }
      responses:
        '201': { description: Discount created }
  /taxes:
    get:
      summary: List business tax rules
      responses:
        '200': { description: Tax-rule collection }
    post:
      summary: Create a tax rule
      responses:
        '201': { description: Tax rule created }
  /staff:
    get:
      summary: List active business members
      responses:
        '200': { description: Staff collection }
    post:
      summary: Add an existing verified ORCA account as staff
      responses:
        '201': { description: Staff membership created; no invitation email is sent }
  /staff/invitations:
    post:
      summary: Add an existing verified ORCA account as staff
      responses:
        '201': { description: Staff membership created; no invitation email is sent }
  /reports/summary:
    get:
      summary: Business finance and integrity aggregates
      description: Optional inclusive business-local date filters apply to invoice issue dates and payment received dates. Subscription count and recurring revenue remain current; receivables and overdue counts reflect current balances on invoices issued within the selected range.
      parameters:
        - in: query
          name: from
          required: false
          description: Inclusive start date (YYYY-MM-DD) in the business timezone.
          schema: { type: string, format: date }
        - in: query
          name: to
          required: false
          description: Inclusive end date (YYYY-MM-DD) in the business timezone.
          schema: { type: string, format: date }
      responses:
        '200': { description: Summary with currency, applied filters, and as-of time }
        '422': { description: Invalid date or reversed date range }
  /exports:
    get:
      summary: List export jobs visible to the current actor
      responses:
        '200': { description: Export job collection }
    post:
      summary: Queue an authorized full or filtered export
      responses:
        '202': { description: Export job accepted }
  /agent/runs:
    get:
      summary: List the current actor's persisted Copilot runs
      responses:
        '200': { description: Run collection }
    post:
      summary: Start a bounded Groq Copilot run when the provider is configured
      responses:
        '202': { description: Run accepted or recorded as unavailable }
  /agent/runs/{id}:
    get:
      summary: Read persisted Copilot run status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Agent run }
  /agent/runs/{id}/cancel:
    post:
      summary: Request cancellation of an unfinished Copilot run
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Run cancellation recorded }
        '409': { $ref: '#/components/responses/Conflict' }
  /agent/approvals:
    get:
      summary: List business action reviews
      responses:
        '200': { description: Approval collection }
  /agent/approvals/{id}/decision:
    post:
      summary: Approve and execute a supported exact proposal, or reject it
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        '200':
          description: Decision and supported action result; approval revalidates permission, input hash, and resource version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '409': { $ref: '#/components/responses/Conflict' }
  /mcp/grants:
    get:
      summary: List OAuth grants authorized for the current business
      responses:
        '200': { description: Grant metadata only; bearer tokens are never returned }
  /mcp/grants/{id}:
    delete:
      summary: Revoke an OAuth grant for this business
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Connection revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/stripe:
    post:
      security: []
      summary: Receive a Stripe webhook after signature verification
      responses:
        '200': { description: Event handled or already processed }
        '400': { description: Invalid signature or payload }
  /exports/{id}:
    get:
      summary: Get scoped export job status
      responses:
        '200': { description: Export status }
  /exports/{id}/download:
    get:
      summary: Download unexpired private export after authorization
      responses:
        '200': { description: ZIP file }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: orca_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    QuoteTemplate:
      type: object
      required: [id, businessId, name, planId, validDays, lines]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        name: { type: string }
        planId: { type: string, format: uuid }
        validDays: { type: integer, minimum: 1 }
        lines:
          type: array
          items:
            type: object
            required: [name, quantity, unitPrice, taxRate]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer, minimum: 1 }
              unitPrice: { $ref: '#/components/schemas/Money' }
              taxRate: { type: string, description: Percentage represented as a decimal string. }
              variant: { type: string, description: Selected catalog variant value, when applicable. }
    CommercialLine:
      type: object
      required: [quantity]
      properties:
        productId: { type: string, format: uuid, description: Omit for the plan line. }
        name: { type: string, description: Display value is replaced with the catalog name. }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money', description: Server re-resolves this from the catalog; client values are not authoritative. }
        taxRate: { type: string, description: Server re-resolves this from the catalog. }
        variant: { type: string, description: Catalog variant name or value; its price adjustment is applied server-side. }
    QuoteTemplatePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/QuoteTemplate' } }
        nextCursor: { type: [string, 'null'] }
    Money:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      examples: ['1234.50']
    DiscountCreate:
      type: object
      required: [name, kind, value]
      properties:
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [fixed, percentage] }
        value: { type: string, description: Decimal string amount or percentage. }
        minimumPurchase: { $ref: '#/components/schemas/Money' }
        minimumQuantity: { type: integer, minimum: 1 }
        scope: { type: string, enum: [subscription, product] }
        productIds: { type: array, items: { type: string, format: uuid } }
        startsAt: { type: string, format: date-time, description: Inclusive activation instant. }
        endsAt: { type: string, format: date-time, description: Inclusive expiry instant. }
        maxUses: { type: integer, minimum: 0, description: Zero means unlimited. }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
    Product:
      type: object
      required: [id, name, type, salesPrice]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        salesPrice: { $ref: '#/components/schemas/Money' }
        costPrice: { $ref: '#/components/schemas/Money' }
        notes: { type: string }
        variants: { type: array, items: { $ref: '#/components/schemas/ProductVariant' } }
        taxRate: { type: string }
        active: { type: boolean }
        archived: { type: boolean }
    ProductVariant:
      type: object
      required: [adjustment]
      properties:
        name: { type: string }
        value: { type: string }
        adjustment: { $ref: '#/components/schemas/Money' }
    ProductPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        nextCursor: { type: [string, 'null'] }
    Plan:
      type: object
      required: [id, name, interval, salesPrice, minimumQuantity, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        interval: { type: string, enum: [daily, weekly, monthly, yearly] }
        salesPrice: { $ref: '#/components/schemas/Money' }
        minimumQuantity: { type: integer, minimum: 1 }
        availableFrom: { type: string, format: date }
        availableUntil: { type: string, format: date }
        taxRate: { type: string }
        autoClose: { type: boolean }
        allowEarlyClose: { type: boolean }
        allowPause: { type: boolean }
        allowRenew: { type: boolean }
        active: { type: boolean }
        archived: { type: boolean }
        version: { type: integer, minimum: 1 }
    PlanPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        nextCursor: { type: [string, 'null'] }
    Invoice:
      type: object
      required: [id, number, status, total, outstanding, currency]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { type: string, enum: [Draft, Confirmed, Paid, Cancelled] }
        total: { $ref: '#/components/schemas/Money' }
        outstanding: { $ref: '#/components/schemas/Money' }
        currency: { type: string, const: INR }
        overdue: { type: boolean }
        calculationHash: { type: string }
    Approval:
      type: object
      required: [id, status, action, resourceId]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [Pending, Approved, Rejected] }
        action: { type: string }
        resourceId: { type: string, format: uuid }
        inputs: { type: object, additionalProperties: true }
        inputsHash: { type: string }
        resourceVersion: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        executionResult: { type: object, additionalProperties: true }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Actor lacks permission
      content:
