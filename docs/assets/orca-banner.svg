<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ORCA — billing that can explain itself</title>
  <desc id="desc">ORCA subscription billing workspace: quotes, subscriptions, invoices, payments, and the evidence behind every number.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211d31"/>
      <stop offset="1" stop-color="#171522"/>
    </linearGradient>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b39af0"/>
      <stop offset="1" stop-color="#7455c4"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98ce6"/>
      <stop offset="1" stop-color="#6e50b3"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ae6cc"/>
      <stop offset="1" stop-color="#5fc6a4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0b0912" flood-opacity=".45"/>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#a88ee3" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#night)"/>
  <rect width="1600" height="520" fill="url(#dots)" opacity=".55"/>

  <!-- Ambient shapes -->
  <circle cx="1460" cy="55" r="280" fill="#7e5dca" opacity=".14" filter="url(#softglow)"/>
  <circle cx="1180" cy="540" r="240" fill="#4cc6a0" opacity=".07" filter="url(#softglow)"/>
  <path d="M-80 470C170 380 310 520 560 432s350-118 600-20 390 48 520-20" fill="none" stroke="#8f74d2" stroke-opacity=".18" stroke-width="1.5"/>
  <path d="M-60 500C190 410 330 550 580 462s350-118 600-20 390 48 520-20" fill="none" stroke="#9ae6cc" stroke-opacity=".1" stroke-width="1.5"/>
  <g fill="none" stroke="#a88ee3" stroke-opacity=".13">
    <circle cx="1535" cy="70" r="170"/>
    <circle cx="1535" cy="70" r="230"/>
    <circle cx="1535" cy="70" r="290"/>
  </g>

  <!-- Brand -->
  <g>
    <rect x="88" y="84" width="54" height="54" rx="16" fill="url(#tile)"/>
    <g fill="#fff" opacity=".96">
      <rect x="100" y="96" width="15" height="15" rx="3.5"/>
      <rect x="119" y="96" width="15" height="15" rx="3.5"/>
      <rect x="100" y="115" width="15" height="15" rx="3.5"/>
      <rect x="119" y="115" width="15" height="15" rx="3.5"/>
    </g>
    <text x="158" y="127" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-3.4" fill="#ffffff">orca</text>
    <text x="160" y="153" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.1" fill="#b7b0ca">BILLING WORKSPACE</text>
  </g>

  <!-- Headline -->
  <text x="88" y="266" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3.6" fill="#ffffff">Billing that can</text>
  <text x="88" y="342" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-3.6" fill="url(#lavender)">explain itself.</text>
  <text x="90" y="392" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#cfcadc">Quotes, subscriptions, invoices, and payments —</text>
  <text x="90" y="420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#cfcadc">every number connected to the evidence behind it.</text>

  <!-- Feature pills -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="90" y="451" width="142" height="35" rx="17.5" fill="#2b2640" stroke="#4a4068"/>
    <circle cx="109" cy="468.5" r="4" fill="#a98ce6"/>
    <text x="122" y="473" fill="#ece8f6">Invoice Truth</text>

    <rect x="244" y="451" width="151" height="35" rx="17.5" fill="#2b2640" stroke="#4a4068"/>
    <circle cx="263" cy="468.5" r="4" fill="#7fd8b8"/>
    <text x="276" y="473" fill="#ece8f6">Control Tower</text>

    <rect x="407" y="451" width="219" height="35" rx="17.5" fill="#2b2640" stroke="#4a4068"/>
    <circle cx="426" cy="468.5" r="4" fill="#f0b89f"/>
    <text x="439" y="473" fill="#ece8f6">Human-reviewed Copilot</text>
  </g>

  <!-- Invoice card -->
  <g filter="url(#shadow)">
    <rect x="990" y="78" width="522" height="366" rx="24" fill="#ffffff"/>
  </g>
  <g>
    <rect x="1018" y="106" width="34" height="34" rx="10" fill="url(#tile)"/>
    <g fill="#fff">
      <rect x="1025" y="113" width="8" height="8" rx="2"/>
      <rect x="1037" y="113" width="8" height="8" rx="2"/>
      <rect x="1025" y="125" width="8" height="8" rx="2"/>
      <rect x="1037" y="125" width="8" height="8" rx="2"/>
    </g>
    <text x="1064" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#282534">Brightloop</text>
    <text x="1064" y="139" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.7" fill="#898496">INVOICE</text>

    <rect x="1372" y="111" width="112" height="26" rx="13" fill="#e7f6ef"/>
    <circle cx="1387" cy="124" r="3.5" fill="#2c8a63"/>
    <text x="1397" y="128.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#287356">Balanced</text>

    <text x="1018" y="190" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#8b8599">INV-2026-00001</text>
    <text x="1018" y="244" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.8" fill="#262433">₹14,747.64</text>
    <text x="1018" y="268" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#777283">1 Oct – 1 Nov 2026 · GST 18%</text>

    <line x1="1018" y1="292" x2="1484" y2="292" stroke="#ece9f1"/>

    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5c5868">
      <text x="1018" y="318">Business monthly × 2</text>
      <text x="1484" y="318" text-anchor="end" fill="#262433" font-weight="600">₹5,897.64</text>
      <text x="1018" y="342">Onboarding sprint × 1</text>
      <text x="1484" y="342" text-anchor="end" fill="#262433" font-weight="600">₹8,850.00</text>
      <text x="1018" y="366">Tax · discount applied first</text>
      <text x="1484" y="366" text-anchor="end" fill="#262433" font-weight="600">₹2,249.64</text>
    </g>

    <rect x="1018" y="392" width="466" height="34" rx="9" fill="#f5f2fb"/>
    <text x="1032" y="414" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5" fill="#6f5aa4">sha256 0050bd86…8f50fd75</text>
    <text x="1470" y="414" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6f5aa4">SNAPSHOT STORED</text>
  </g>
</svg>
